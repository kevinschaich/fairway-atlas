    <!-- Loading telemetry the Loading details panel reads; starts before any module loads. -->
    <script>window.__lt=[];window.__ev=[];document.addEventListener("data-progress",e=>window.__ev.push([Math.round(performance.now()),e.detail.stage,String(e.detail.message).slice(0,70)]));window.__t0=performance.now();try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__lt.push([Math.round(e.startTime),Math.round(e.duration)])}).observe({type:"longtask",buffered:true})}catch(e){}</script>

    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
